name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package structure
        run: python3 scripts/validate-skill.py .
      - name: Compile audit scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check installer syntax
        run: sh -n install.sh
